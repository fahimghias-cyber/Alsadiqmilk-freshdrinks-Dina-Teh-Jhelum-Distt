plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alsadiq.bookingapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.alsadiq.bookingapp"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding false
    }
}

// Task to ensure latest web assets from root folder are synced before build
tasks.register('syncWebAssets', Copy) {
    from("${rootDir}/..") {
        include 'index.html'
        include 'styles.css'
        include 'app.js'
        include 'assets/**'
    }
    into("${projectDir}/src/main/assets")
}

preBuild.dependsOn(syncWebAssets)

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
}
